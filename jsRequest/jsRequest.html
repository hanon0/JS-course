    <script>

    function readposts(){
        let request = new XMLHttpRequest();
        request.open("GET", "https://jsonplaceholder.typicode.com/todos");
        request.responseType="json";
        request.onload =  function(){
            if(request.status >=200 && request.status < 300){
            let posts = request.response;
            for(post of posts){
                document.getElementById("content").innerHTML += `<h2>${post.title}</h2>`;  
                console.log(post.title); 
            }
        }
        else{
            alert("the request is not successful");
        }
        }
        request.send();
    }

    function updatepost(){
    let request = new XMLHttpRequest();

}`

    request.onload = function(){

        alert("the post is updated successfully");

}

    function deletepost(){
    let request = new XMLHttpRequest();
    request.open("DELETE" , "https://jsonplaceholder.typicode.com/posts/1");
    request.responseType = "json";
    request.setRequestHeader("Accept" , "application/json");
    request.setRequestHeader("content-type", "application/json");
    request.send();
    request.onload = function(){
        if(request.status >=200 && request.status < 300){
        let response = request.response;
        console.log(response);
        console.log("the statues code is " + request.status);
        alert("the post is deleted successfully");
        }
        else{
            alert("the request is not successful");
        }
    }
}

////// filter post //////
    function filterpost(){
    let request = new XMLHttpRequest();
    request.open("GET" , "https://jsonplaceholder.typicode.com/posts?userId=1");
    request.responseType = "json";
    request.send();
    request.onload = function(){
        if(request.status >=200 && request.status < 300){
        let posts = request.response;
        for (post of posts){
            document.getElementById("content").innerHtml += `<h2>${post.title}</h2>`;
        }
    }
        else{
            alert("the request is not successful");
        }
    }
}
